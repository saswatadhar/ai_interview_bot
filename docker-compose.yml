services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: sqlite:////backend/interview.db
      HF_HOME: /model-cache
    volumes:
      - ./backend/interview.db:/backend/interview.db
      - model-cache:/model-cache
    restart: unless-stopped

volumes:
  model-cache:
